<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEFAZ/SC — Acompanhamento de Estudos (Cargo A01)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f9;--card:#fff;--sub:#f8fafc;--text:#0f172a;--muted:#64748b;--border:#e2e8f0}body.dark{--bg:#0f172a;--card:#1e293b;--sub:#334155;--text:#f8fafc;--muted:#94a3b8;--border:#475569}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,sans-serif;transition:.2s}.card,.sub{background:var(--card);border-color:var(--border)}.sub{background:var(--sub)}.muted{color:var(--muted)}input,textarea,select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:.5rem;padding:.45rem .6rem;font-size:.8rem;width:100%}button,a{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #10b981;outline-offset:2px}.topic{transition:.15s}.topic:hover{border-color:#38bdf8}.bar{height:7px;border-radius:99px;background:#94a3b833;overflow:hidden}.fill{height:100%;background:#10b981;border-radius:99px}
</style>
</head>
<body class="dark"><div id="app"></div>
<script>
const EXAM_DATE=new Date('2026-11-22T00:00:00'),KEY='sefaz_sc_study_app_v3';
const P1=[
 ['Língua Portuguesa',['Redação Oficial','Ortografia e acentuação','Crase','Compreensão e interpretação de textos','Relação do texto com seu contexto histórico','Denotação e conotação','Discurso direto, indireto e indireto livre','Intertextualidade e figuras de linguagem','Morfossintaxe e formação de palavras','Sinonímia, antonímia e pontuação','Pronomes, concordância, flexão e vozes do verbo','Correlação de tempos e modos verbais','Regência, coordenação, subordinação e conectivos','Redação: correção, organização e transformação de estruturas']],
 ['Matemática Financeira',['Juros simples','Juros compostos e capitalização contínua','Descontos simples e compostos','Sistemas de amortização: Price, SAC e sistema misto','Análise de investimentos: fluxo de caixa, valor atual e TIR']],
 ['Estatística Descritiva, Probabilidade e Inferência',['Estatística descritiva: gráficos, tabelas e medidas de posição','Medidas de variabilidade: variância, desvio-padrão e amplitude','Técnicas de contagem e análise combinatória','Probabilidades e distribuições discretas e contínuas','Inferência estatística, amostragem e intervalos de confiança','Testes de hipóteses para médias e proporções','Correlação e regressão linear simples']],
 ['Raciocínio Lógico',['Estruturas lógicas e relações arbitrárias','Raciocínio verbal, matemático, sequencial, espacial e temporal','Dedução de novas informações e avaliação de condições','Argumentação e conclusões válidas a partir de hipóteses']],
 ['Noções de Direito Constitucional',['Princípios fundamentais e direitos e garantias fundamentais','Organização político-administrativa do Estado','Administração Pública e servidores públicos','Poder Executivo e Poder Legislativo','Finanças públicas, ordem econômica e ordem social','Constituição do Estado de Santa Catarina']],
 ['Noções de Direito Administrativo',['Poderes da Administração, responsabilidade civil e controle','LC Estadual nº 741/2019','Lei Estadual nº 6.745/1985','Lei Federal nº 12.527/2011 — LAI','Lei Federal nº 8.429/1992 — Improbidade','Lei Federal nº 14.133/2021 — Licitações']],
 ['Ciência e Análise de Dados',['Fundamentos, tipos, coleta, qualidade e tratamento de dados','Business Intelligence, analytics, data mining e dashboards','Governo Digital, automação e Inteligência Artificial','Aprendizado de máquina, IA generativa e LLMs','LGPD: princípios, bases legais, direitos e agentes de tratamento']],
 ['Ética, Integridade e Prevenção ao Assédio e Discriminação',['Ética no setor público: princípios, deveres e vedações','Integridade, compliance e riscos de fraude e corrupção','Prevenção e combate ao assédio moral e sexual','Prevenção e combate a todas as formas de discriminação','Lei Federal nº 12.846/2013 — Anticorrupção']],
 ['Conhecimentos Regionais de Santa Catarina',['História, Geografia, Cultura, Política e Economia de Santa Catarina']]
];
const P2=[
 ['Ciclo de Planejamento e Gestão Orçamentária',['PPA, LDO e LOA','Funções econômicas, emendas parlamentares e revisão de gastos','Técnicas orçamentárias e execução financeira','Receita e despesa pública: estágios e classificações','Reforma Tributária na Constituição Federal','MTO, MCASP e normas de execução orçamentária']],
 ['Lei de Responsabilidade Fiscal (LRF / LC nº 101/2000)',['Planejamento fiscal, metas e riscos fiscais','Receita pública, renúncia e Receita Corrente Líquida','Despesa pública e despesa obrigatória continuada','Despesa total com pessoal, limites e recondução','Transferências voluntárias e recursos ao setor privado','Dívida pública, operações de crédito e garantias','Gestão de caixa e restos a pagar','Transparência, RREO, RGF e fiscalização']],
 ['Gestão de Riscos, Governança e Avaliação por Resultados',['Gestão de riscos fiscais e organizacionais','Governança pública: liderança, estratégia e controle','Gestão por resultados e indicadores de desempenho','Desenho, monitoramento e avaliação de políticas públicas','Gestão de processos e projetos']],
 ['Custos no Setor Público',['NBC TSP 34: conceitos, objetos e centros de custos','Custos diretos, indiretos, fixos e variáveis','Métodos de custeio e sistema de informação de custos','Integração das informações orçamentárias, patrimoniais e financeiras','Informação de custos para eficiência e tomada de decisão']],
 ['Administração Geral',['Teorias da Administração e evolução das escolas','Funções, tipos e estruturas organizacionais','Processo decisório e tipos de decisão','Organização racional do trabalho, eficiência e eficácia','Ambientes organizacionais, centralização e descentralização','Departamentalização e visão sistêmica','Noções de gerenciamento de projetos']],
 ['Administração Estratégica',['Missão, visão, valores e planejamento estratégico','Diagnóstico interno e externo e formulação da estratégia','Implementação e controle da estratégia','Análise SWOT e Cinco Forças de Porter','Cadeia de Valor']]
];
const subjects=tab=>tab==='p1'?P1:P2;
const blank=()=>({theme:'dark',tab:'overview',filter:'all',progress:{},openSubjects:{},openTopics:{}});
let state=blank();
function normalize(raw){let s=blank();if(raw&&typeof raw==='object'){s={...s,...raw};s.theme=raw.theme==='light'?'light':'dark';s.tab=['overview','p1','p2'].includes(raw.tab||raw.activeTab)?(raw.tab||raw.activeTab):'overview';s.progress=raw.progress||{};s.openSubjects=raw.openSubjects||{};s.openTopics=raw.openTopics||{};if(raw.done)Object.keys(raw.done).forEach(k=>{let d=s.progress[k]||{};s.progress[k]={...d,theory:!!raw.done[k]}})}return s}
function load(){try{state=normalize(JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('sefaz_sc_study_app_v2')||'null'))}catch(e){state=blank()}document.body.className=state.theme;render()}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function today(){return new Date().toISOString().slice(0,10)}
function data(k){if(!state.progress[k])state.progress[k]={theory:false,theoryDate:'',revisions:[],exerciseSessions:[],link:'',notes:''};let d=state.progress[k];d.revisions=Array.isArray(d.revisions)?d.revisions:[];d.exerciseSessions=Array.isArray(d.exerciseSessions)?d.exerciseSessions:[];return d}
function allTopics(){return [...P1,...P2].reduce((n,s)=>n+s[1].length,0)}
function stats(){let theory=0,rev=0,qty=0,acc=0,sessions=0;[P1,P2].forEach(list=>list.forEach((s,si)=>s[1].forEach((_,i)=>{let d=state.progress[(list===P1?'p1':'p2')+si+'_'+i];if(d){if(d.theory)theory++;rev+=(d.revisions||[]).length;sessions+=(d.exerciseSessions||[]).length;(d.exerciseSessions||[]).forEach(x=>{qty+=+x.qty||0;acc+=+x.acc||0})}})));return{total:allTopics(),theory,rev,qty,acc,sessions,pct:Math.round(theory/allTopics()*100),accPct:qty?Math.round(acc/qty*100):0}}
function header(){let d=Math.ceil((EXAM_DATE-new Date())/86400000);return `<header class="card border-b sticky top-0 z-20 backdrop-blur bg-opacity-90"><div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-3"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-xl">✓</div><div><h1 class="text-lg font-bold">SEFAZ/SC • Edital nº 01/2026</h1><p class="text-xs muted">Auditor Estadual de Finanças Públicas — Administração e Engenharias (Cargo A01)</p></div></div><div class="flex flex-wrap gap-2"><span class="px-3 py-1.5 rounded-xl bg-indigo-500/10 border border-indigo-500/30 text-indigo-400 text-xs font-semibold">${d>0?'⏳ Prova em '+d+' dias (22/11/2026)':d===0?'🎯 Prova Hoje!':'✅ Prova já realizada'}</span><button onclick="theme()" class="px-3 py-1.5 rounded-xl text-xs font-semibold sub border">${state.theme==='dark'?'☀️ Modo Claro':'🌙 Modo Escuro'}</button><button onclick="exportBackup()" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-emerald-600 text-white">💾 Exportar</button><label class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-blue-600 text-white cursor-pointer">📂 Importar<input id="import" type="file" accept=".json" class="hidden" onchange="importBackup(event)"></label><button onclick="resetData()" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-rose-600 text-white">🗑️ Resetar</button></div></div></header>`}
function cards(){let s=stats();return `<div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6">${[['Progresso Edital',s.pct+'%',s.theory+' tópicos','text-emerald-400'],['Teoria Vista',s.pct+'%',s.theory+' concluídos','text-blue-400'],['Revisões Feitas',s.rev,s.sessions+' sessões','text-purple-400'],['Questões Feitas',s.qty,s.sessions+' treinos','text-amber-400'],['Taxa de Acertos',s.accPct+'%',s.acc+' acertos','text-emerald-400']].map(x=>`<div class="card p-4 rounded-2xl border"><span class="text-[11px] font-bold uppercase tracking-wider muted">${x[0]}</span><div class="text-2xl font-extrabold mt-1 ${x[3]}">${x[1]}</div><div class="text-xs muted mt-1">${x[2]}</div></div>`).join('')}</div>`}
function overview(){return `<div class="space-y-6"><div class="grid grid-cols-1 lg:grid-cols-3 gap-6">${[['💼 Cargo e Vagas',['Cargo|Auditor Estadual de Finanças Públicas','Área|Administração e Engenharias (A01)','Remuneração Inicial|R$ 25.337,61','Carga Horária|40 horas semanais','Vagas|5 ampla + 1 PcD']],['📅 Inscrições e Datas',['Inscrições|04/09 a 05/10/2026','Taxa|R$ 200,00 (DARE)','Data das provas|22/11/2026','Banca|FCC']],['⏱️ Aplicação das Provas',['Local|Florianópolis/SC','P1|Conhecimentos Gerais — manhã (4h)','P2|Conhecimentos Específicos — tarde (5h)','Formato|Objetiva (A a E)']]].map(x=>`<div class="card p-5 rounded-2xl border"><h3 class="font-bold mb-3">${x[0]}</h3>${x[1].map(y=>{let a=y.split('|');return `<div class="flex justify-between gap-3 py-1.5 border-b text-xs" style="border-color:var(--border)"><span class="muted">${a[0]}</span><b class="text-right">${a[1]}</b></div>`}).join('')}</div>`).join('')}</div><div class="card p-5 rounded-2xl border"><h3 class="font-bold mb-3">📊 Estrutura das Provas</h3><div class="grid md:grid-cols-2 gap-3"><div class="sub p-4 rounded-xl border"><b class="text-amber-400">PROVA 1 — Conhecimentos Gerais · Peso 1</b><p class="text-xs muted mt-1">80 questões · manhã · 4 horas · ${P1.length} disciplinas</p></div><div class="sub p-4 rounded-xl border"><b class="text-cyan-400">PROVA 2 — Conhecimentos Específicos · Peso 2</b><p class="text-xs muted mt-1">100 questões · tarde · 5 horas · ${P2.length} disciplinas</p></div></div></div></div>`}
function topic(sid,i,text){let k=sid+'_'+i,d=data(k),open=!!state.openTopics[k],qty=(d.exerciseSessions||[]).reduce((n,x)=>n+(+x.qty||0),0),acc=(d.exerciseSessions||[]).reduce((n,x)=>n+(+x.acc||0),0),pct=qty?Math.round(acc/qty*100):0;return `<div class="topic border rounded-xl p-4 ${d.theory?'bg-emerald-500/10':''}"><div class="flex flex-col lg:flex-row justify-between gap-3"><label class="flex gap-3 flex-1 cursor-pointer"><input type="checkbox" ${d.theory?'checked':''} onchange="toggleTheory('${k}',this.checked)" class="mt-1 w-4 h-4"><span class="text-sm ${d.theory?'line-through opacity-70':''}"><b class="muted mr-2">#${i+1}</b>${text}</span></label><div class="flex flex-wrap items-center gap-2"><span class="px-2.5 py-1.5 sub border rounded-xl text-xs font-bold ${pct>=80?'text-emerald-400':pct>=60?'text-amber-400':'text-rose-400'}">${qty?pct+'% ('+acc+'/'+qty+')':'Sem exercícios'}</span>${d.link?`<a href="${d.link}" target="_blank" class="px-3 py-1.5 text-blue-400 border border-blue-500/30 rounded-xl text-xs">🔗 Caderno</a>`:''}<button onclick="topicOpen('${k}')" class="px-3 py-1.5 sub border rounded-xl text-xs font-semibold">⚙️ ${open?'Fechar':'Detalhes'}</button></div></div>${open?details(k,d):''}</div>`}
function details(k,d){return `<div class="pt-4 mt-3 border-t space-y-4" style="border-color:var(--border)"><div class="grid md:grid-cols-2 gap-4"><div class="space-y-3"><div class="sub p-3 rounded-xl border"><b class="text-xs text-emerald-400">📖 Data da teoria</b><div class="flex gap-2 mt-2"><input id="td_${k}" type="date" max="${today()}" value="${d.theoryDate||today()}"><button onclick="saveTheory('${k}')" class="bg-emerald-600 text-white rounded-lg px-3 text-xs">Salvar</button></div></div><div class="sub p-3 rounded-xl border"><b class="text-xs text-amber-400">➕ Sessão de exercícios</b><div class="grid grid-cols-3 gap-2 mt-2"><input id="q_${k}" type="number" placeholder="Qtd"><input id="a_${k}" type="number" placeholder="Acertos"><input id="ed_${k}" type="date" max="${today()}" value="${today()}"></div><button onclick="addExercise('${k}')" class="w-full bg-amber-600 text-white rounded-lg py-1.5 mt-2 text-xs">Salvar Sessão</button></div><div class="sub p-3 rounded-xl border"><b class="text-xs text-purple-400">📅 Data de revisão</b><div class="flex gap-2 mt-2"><input id="rd_${k}" type="date" max="${today()}" value="${today()}"><button onclick="addRevision('${k}')" class="bg-purple-600 text-white rounded-lg px-3 text-xs">Adicionar</button></div></div><div class="sub p-3 rounded-xl border"><b class="text-xs text-blue-400">🔗 Link do Caderno TEC / Questões</b><div class="flex gap-2 mt-2"><input id="ln_${k}" type="url" value="${d.link||''}" placeholder="https://..."><button onclick="saveLink('${k}')" class="bg-blue-600 text-white rounded-lg px-3 text-xs">Salvar</button></div></div></div><div><label class="text-xs font-bold muted">📝 Resumo e anotações</label><textarea id="nt_${k}" oninput="state.progress['${k}'].notes=this.value;save()" rows="12" class="mt-2" placeholder="Resumos, pegadinhas ou leis importantes...">${d.notes||''}</textarea><span class="text-[10px] muted block text-right">Salvo automaticamente</span></div></div><div class="grid md:grid-cols-2 gap-4"><div class="sub p-3 rounded-xl border"><b class="text-xs text-amber-400">Histórico de treinos</b>${d.exerciseSessions.length?d.exerciseSessions.map((x,i)=>`<div class="flex justify-between text-xs py-1"><span>${x.date}</span><span>${x.acc}/${x.qty}</span><button class="text-rose-400" onclick="removeExercise('${k}',${i})">Excluir</button></div>`).join(''):'<p class="text-xs muted italic mt-2">Nenhum treino registrado.</p>'}</div><div class="sub p-3 rounded-xl border"><b class="text-xs text-purple-400">Histórico de revisões</b>${d.revisions.length?d.revisions.map((x,i)=>`<div class="flex justify-between text-xs py-1"><span>Revisão #${i+1}</span><span>${x}</span><button class="text-rose-400" onclick="removeRevision('${k}',${i})">Excluir</button></div>`).join(''):'<p class="text-xs muted italic mt-2">Nenhuma revisão registrada.</p>'}</div></div></div>`}
function subjectsView(tab){let list=subjects(tab),filter=state.filter;return `<div class="space-y-4"><div class="card p-4 rounded-2xl border flex flex-wrap items-center gap-3"><label class="text-sm font-semibold">Filtrar por disciplina:</label><select onchange="state.filter=this.value;save();render()" class="flex-1 md:max-w-md"><option value="all">Todas as disciplinas</option>${list.map((s,i)=>`<option value="${tab+i}" ${filter===tab+i?'selected':''}>${s[0]}</option>`).join('')}</select><span class="text-xs muted">${list.length} disciplinas</span></div>${list.map((s,si)=>({s,si})).filter(x=>filter==='all'||filter===tab+x.si).map(({s,si})=>{let sid=tab+si,open=state.openSubjects[sid]!==false,n=s[1].filter((_,i)=>data(sid+'_'+i).theory).length;return `<section class="card rounded-2xl border overflow-hidden"><button onclick="state.openSubjects['${sid}']=!${open};save();render()" class="w-full text-left p-4 sub border-b flex justify-between items-center"><div><h2 class="font-bold">${si+1}. ${s[0]}</h2><span class="text-xs muted">${n}/${s[1].length} tópicos estudados</span></div><span class="text-emerald-400 font-bold">${Math.round(n/s[1].length*100)}% ${open?'▲':'▼'}</span></button>${open?`<div class="p-3 space-y-2">${s[1].map((t,i)=>topic(sid,i,t)).join('')}</div>`:''}</section>`}).join('')}</div>`}
function render(){let s=stats();document.getElementById('app').innerHTML=header()+`<main class="max-w-7xl mx-auto px-4 py-6">${cards()}<nav class="flex border-b mb-6 overflow-x-auto" style="border-color:var(--border)">${[['overview','📋 Panorama do Edital'],['p1','📘 Conhecimentos Gerais (P1)'],['p2','📙 Conhecimentos Específicos (P2 — Peso 2)']].map(x=>`<button onclick="state.tab='${x[0]}';state.filter='all';save();render()" class="px-5 py-3 font-semibold text-sm whitespace-nowrap ${state.tab===x[0]?'border-b-2 border-emerald-400 text-emerald-400':'muted'}">${x[1]}</button>`).join('')}</nav>${state.tab==='overview'?overview():subjectsView(state.tab)}</main>`}
function theme(){state.theme=state.theme==='dark'?'light':'dark';document.body.className=state.theme;save();render()}function toggleTheory(k,v){data(k).theory=v;save();render()}function topicOpen(k){state.openTopics[k]=!state.openTopics[k];save();render()}function saveTheory(k){let v=document.getElementById('td_'+k).value;if(v>today())return alert('Não é permitido registrar datas futuras.');let d=data(k);d.theory=true;d.theoryDate=v;save();render()}function addExercise(k){let q=+document.getElementById('q_'+k).value,a=+document.getElementById('a_'+k).value,v=document.getElementById('ed_'+k).value;if(v>today()||!q||a<0||a>q)return alert('Informe valores válidos e uma data que não seja futura.');data(k).exerciseSessions.unshift({qty:q,acc:a,date:v});save();render()}function addRevision(k){let v=document.getElementById('rd_'+k).value;if(!v||v>today())return alert('Informe uma data válida.');data(k).revisions.unshift(v);save();render()}function saveLink(k){data(k).link=document.getElementById('ln_'+k).value.trim();save();render()}function removeExercise(k,i){data(k).exerciseSessions.splice(i,1);save();render()}function removeRevision(k,i){data(k).revisions.splice(i,1);save();render()}
function exportBackup(){let a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(state,null,2));a.download='SEFAZ_SC_Estudos_Backup_'+today()+'.json';a.click()}function importBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state=normalize(JSON.parse(r.result));save();render();alert('Backup importado com sucesso!')}catch(_){alert('Arquivo de backup inválido.')}e.target.value=''};r.readAsText(f)}function resetData(){if(confirm('Deseja apagar todo o progresso salvo no navegador?')){localStorage.removeItem(KEY);localStorage.removeItem('sefaz_sc_study_app_v2');state=blank();save();render();alert('Dados resetados com sucesso.')}}
load();
</script></body></html>
