<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEFAZ/SC — Acompanhamento de Estudos (Cargo A01)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','sans-serif']}}}}</script>
<style>body{font-family:Inter,sans-serif}.topic{transition:.15s}.topic:hover{border-color:#38bdf8}.dark .app{background:#0f172a;color:#f8fafc}.dark .card{background:#1e293b;border-color:#334155}.dark .muted{color:#94a3b8}.dark input,.dark textarea{background:#0f172a;color:#f8fafc;border-color:#475569}.light .app{background:#f1f5f9;color:#0f172a}.light .card{background:#fff;border-color:#cbd5e1}.light .muted{color:#64748b}input,textarea{border:1px solid #cbd5e1;border-radius:.5rem;padding:.45rem .6rem;font-size:.8rem;width:100%}button{cursor:pointer}</style>
</head>
<body class="dark"><div id="app" class="app min-h-screen pb-12">
<header class="sticky top-0 z-10 border-b border-slate-300/30 bg-slate-900/90 backdrop-blur"><div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap gap-3 items-center justify-between"><div><h1 class="text-xl font-extrabold text-white">SEFAZ/SC — Auditor Fiscal</h1><p class="text-xs text-slate-300">Acompanhamento de Estudos · Cargo A01</p></div><div class="flex items-center gap-2"><span id="countdown" class="rounded-full bg-sky-600 px-3 py-1 text-xs font-bold text-white"></span><button onclick="toggleTheme()" class="rounded-lg border border-slate-500 px-3 py-2 text-xs text-white">Tema</button><button onclick="exportData()" class="rounded-lg bg-emerald-600 px-3 py-2 text-xs font-bold text-white">Exportar</button><label class="rounded-lg bg-slate-600 px-3 py-2 text-xs font-bold text-white">Importar<input type="file" accept="application/json" onchange="importData(event)" class="hidden"></label></div></div></header>
<main class="max-w-7xl mx-auto px-4 py-6"><div class="flex gap-2 overflow-x-auto border-b border-slate-300/30 mb-5"><button class="tab px-4 py-3 text-sm font-bold" onclick="showTab('overview')">Visão geral</button><button class="tab px-4 py-3 text-sm font-bold" onclick="showTab('p1')">P1 · Gerais <span class="text-xs">(Peso 1)</span></button><button class="tab px-4 py-3 text-sm font-bold" onclick="showTab('p2')">P2 · Específicos <span class="text-xs">(Peso 2)</span></button></div><div id="stats"></div><div id="content"></div></main></div>
<script>
const EXAM_DATE=new Date('2026-11-22T00:00:00'),KEY='sefaz_sc_study_app_v3';
const P1=[
['Língua Portuguesa',['Redação Oficial','Ortografia e acentuação','Emprego do sinal indicativo de crase','Compreensão e interpretação de textos de gêneros variados','Relação do texto com seu contexto histórico','Denotação e conotação','Discurso direto, discurso indireto e discurso indireto livre','Intertextualidade e figuras de linguagem','Morfossintaxe, elementos estruturais e processos de formação de palavras','Sinonímia, antonímia e pontuação','Pronomes, concordância nominal/verbal, flexão nominal/verbal e vozes do verbo','Correlação de tempos e modos verbais','Regência nominal/verbal, coordenação, subordinação e conectivos','Redação: confronto/reconhecimento de frases corretas e incorretas; organização e reorganização de orações e períodos; equivalência e transformação de estruturas']],
['Matemática Financeira',['Juros simples: montante, juros, taxa real, taxa efetiva, taxas equivalentes e capitais equivalentes','Juros compostos: montante, juros, taxa real, taxa efetiva, taxas equivalentes, capitais equivalentes e capitalização contínua','Descontos simples e compostos: desconto racional e desconto comercial','Sistemas de amortização: Sistema Francês (Tabela Price), Sistema de Amortização Constante (SAC) e sistema misto','Análise de investimentos: fluxo de caixa, valor atual e Taxa Interna de Retorno (TIR)']],
['Estatística Descritiva, Probabilidade e Inferência',['Estatística descritiva: organização de dados em gráficos e tabelas, medidas de posição (média, moda, mediana, quartis, mínimo e máximo) e medidas de variabilidade (variância, desvio-padrão, amplitude)','Técnicas de contagem e análise combinatória: combinações simples, arranjos e permutações com e sem repetição','Probabilidades: conceito, espaço amostral, axiomas e distribuições discretas e contínuas (Bernoulli, Binomial, Geométrica, Uniforme, Normal, Poisson, Qui-quadrado, t de Student e F-Snedecor)','Inferência estatística e amostragem: amostras casuais e não casuais, processos de amostragem, estimativa pontual de parâmetros, intervalos de confiança e testes de hipóteses para médias e proporções','Análise de associação: correlação e regressão linear simples']],
['Raciocínio Lógico',['Estruturas lógicas e relações arbitrárias entre pessoas, lugares, objetos ou eventos fictícios; dedução de novas informações e avaliação de condições','Compreensão e elaboração da lógica de situações: raciocínio verbal, matemático, sequencial, orientação espacial e temporal, formação de conceitos e discriminação de elementos','Processo lógico de argumentação: dedução de conclusões válidas a partir de um conjunto de hipóteses']],
['Noções de Direito Constitucional',['Constituição da República Federativa do Brasil de 1988: Princípios fundamentais, Direitos e garantias fundamentais','Organização político-administrativa do Estado (União, Estados, DF, Municípios e Territórios)','Administração Pública (disposições gerais e servidores públicos)','Poder Executivo (atribuições do Presidente da República)','Poder Legislativo (estrutura, funcionamento, fiscalização contábil, financeira e orçamentária)','Finanças Públicas, Ordem econômica/financeira e Ordem social (seguridade social, mínimos constitucionais federais e estaduais)','Constituição do Estado de Santa Catarina']],
['Noções de Direito Administrativo',['Poderes da Administração Pública, Responsabilidade Civil do Estado e Controle da Administração Pública','Lei Complementar Estadual nº 741/2019 (Estrutura organizacional do Estado)','Lei Estadual nº 6.745/1985 (Estatuto dos servidores públicos civis de SC)','Lei Federal nº 12.527/2011 (Lei de Acesso à Informação)','Lei Federal nº 8.429/1992 (Lei de Improbidade Administrativa)','Lei Federal nº 14.133/2021 (Nova Lei de Licitações e Contratos Administrativos)']],
['Ciência e Análise de Dados',['Fundamentos: conceitos aplicados à Administração Pública, controle e finanças; dados estruturados, semiestruturados e não estruturados; coleta, qualidade, tratamento, análise, interpretação, padrões, tendências e anomalias','Business Intelligence (BI) e Analytics: conceitos de BI, analytics, data mining, web scraping, relatórios gerenciais, dashboards e visualização de dados','Governo Digital, Automação e Inteligência Artificial: transformação digital, serviços públicos digitais, interoperabilidade, automação, Administração Pública orientada por dados, IA, aprendizado de máquina, IA generativa e modelos de linguagem (LLMs)','Proteção de Dados Pessoais: Lei Federal nº 13.709/2018 (LGPD), princípios, conceitos, bases legais, direitos dos titulares, agentes de tratamento, tratamento pelo Poder Público, compartilhamento e segurança']],
['Ética, Integridade e Prevenção ao Assédio e Discriminação',['Ética no setor público: princípios, deveres e vedações institucionais','Programas de integridade e compliance na administração pública; gestão de riscos de fraude e corrupção','Prevenção e combate ao assédio moral, assédio sexual e a todas as formas de discriminação','Lei Federal nº 12.846/2013 (Lei Anticorrupção)']],
['Conhecimentos Regionais de Santa Catarina',['História, Geografia, Cultura, Política e Economia do Estado de Santa Catarina']]
];
const P2=[
['Ciclo de Planejamento e Gestão Orçamentária',['Processo de planejamento público no Brasil: Plano Plurianual (PPA), Lei de Diretrizes Orçamentárias (LDO) e Lei Orçamentária Anual (LOA)','Conceitos e funções econômicas no orçamento público; Emendas Parlamentares; Revisão de Gastos (Spending Review)','Técnicas orçamentárias (orçamento-programa); execução orçamentária e financeira; créditos adicionais','Receita e despesa pública (estágios, classificações, renúncia de receita)','Reforma Tributária na Constituição Federal','Manual Técnico de Orçamento MPO/SOF (MTO 2027); Manual de Contabilidade Aplicada ao Setor Público (MCASP)','Portaria STN nº 710/2021; Portaria Conjunta STN/SOF nº 163/2001']],
['Lei de Responsabilidade Fiscal (LRF / LC nº 101/2000)',['Módulo I — Planejamento Fiscal e Metas: Anexo de Metas Fiscais, Anexo de Riscos Fiscais na LDO, resultados primário e nominal, programação financeira, cronograma de desembolso e limitação de empenho','Módulo II — Receita Pública e Renúncia: previsão, arrecadação, renúncia de receita e Receita Corrente Líquida (RCL — conceito, apuração e deduções)','Módulo III — Despesa Pública e DOCC: geração da despesa pública e Despesa Obrigatória de Caráter Continuado (DOCC — requisitos de criação e expansão)','Módulo IV — Despesa Total com Pessoal (DTP): apuração, composição, limites globais, prudenciais e por Poder/Órgão, medidas de recondução e sanções pelo descumprimento','Módulo V — Transferências Voluntárias e Setor Privado: exigências e vedações para repasse de transferências voluntárias; regras para destinação de recursos ao setor privado','Módulo VI — Dívida Pública e Operações de Crédito: dívida fundada e flutuante, regras de endividamento, limites/condições para operações de crédito, garantias e contragarantias','Módulo VII — Gestão de Caixa e Restos a Pagar: disponibilidade de caixa, gestão do fluxo financeiro, Restos a Pagar e vedações de contração de despesa em fim de mandato','Módulo VIII — Transparência, Relatórios e Controle: instrumentos de transparência fiscal, Relatório Resumido da Execução Orçamentária (RREO), Relatório de Gestão Fiscal (RGF), controle interno, controle externo e fiscalização']],
['Gestão de Riscos, Governança e Avaliação por Resultados',['Gestão de Riscos Fiscais e Riscos Organizacionais','Governança pública: princípios de liderança, estratégia e controle','Gestão por resultados no setor público: indicadores de desempenho (eficiência, eficácia, efetividade, economicidade e execução)','Desenho, monitoramento e avaliação de políticas públicas','Gestão e monitoramento de processos e projetos']],
['Custos no Setor Público',['NBC TSP 34 — Custos no Setor Público: conceitos, padrões, objetos de custos, centros de responsabilidade, direcionadores de custos','Custos diretos/indiretos, fixos/variáveis','Métodos de custeio, Sistema de Custos, modelo de gerenciamento e Sistema de Informação de Custos','Implantação e integração das informações orçamentárias, patrimoniais, financeiras e de custos','Utilização da informação de custos para avaliação de serviços públicos, eficiência, planejamento e tomada de decisão']],
['Administração Geral',['Teorias da Administração e evolução das escolas administrativas; metáforas organizacionais','Funções do administrador; tipos de organização e estrutura organizacional','Processo decisório e tipos de decisão','Organização Racional do Trabalho; Eficiência e Eficácia; Divisão do trabalho e especialização','Ambientes organizacionais; organizações formais e informais','Centralização e Descentralização; Departamentalização; Visão sistêmica','Noções básicas de Gerenciamento de Projetos']],
['Administração Estratégica',['Planejamento Estratégico: definição de missão, visão e valores','Diagnóstico do ambiente externo e interno; formulação, implementação e controle da estratégia','Ferramentas de diagnóstico: análise SWOT, Cinco Forças Competitivas de Porter','Cadeia de Valor']]
];
let state=JSON.parse(localStorage.getItem(KEY)||'{"done":{},"notes":{},"tab":"overview","theme":"dark"}');
const all=()=>[...P1,...P2];const total=()=>all().reduce((n,s)=>n+s[1].length,0);const done=()=>Object.values(state.done).filter(Boolean).length;
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';document.body.className=state.theme;save();render()}
function updateCountdown(){let d=Math.ceil((EXAM_DATE-new Date())/86400000);document.getElementById('countdown').textContent=d>0?`⏳ Prova em ${d} dias · 22/11/2026`:'🎯 Dia da prova'}
function stats(){let p=total()?Math.round(done()/total()*100):0;return `<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6"><div class="card border rounded-xl p-4"><div class="muted text-xs">Conteúdo programático</div><b class="text-2xl">${total()}</b><div class="muted text-xs">tópicos</div></div><div class="card border rounded-xl p-4"><div class="muted text-xs">Estudados</div><b class="text-2xl text-emerald-500">${done()}</b><div class="muted text-xs">${p}% concluído</div></div><div class="card border rounded-xl p-4"><div class="muted text-xs">P1 · Gerais</div><b class="text-2xl">${P1.reduce((n,s)=>n+s[1].length,0)}</b><div class="muted text-xs">Peso 1</div></div><div class="card border rounded-xl p-4"><div class="muted text-xs">P2 · Específicos</div><b class="text-2xl">${P2.reduce((n,s)=>n+s[1].length,0)}</b><div class="muted text-xs">Peso 2</div></div></div><div class="h-2 rounded-full bg-slate-300/40 mb-6"><div class="h-2 rounded-full bg-emerald-500" style="width:${p}%"></div></div>`}
function overview(){return `<div class="card border rounded-2xl p-6"><h2 class="text-lg font-bold mb-2">Conteúdo programático completo</h2><p class="muted text-sm">O edital foi organizado integralmente por prova, disciplina e tópico. Marque cada tópico como estudado para acompanhar sua evolução. Seus dados ficam salvos neste navegador.</p><div class="grid md:grid-cols-2 gap-4 mt-5"><div class="rounded-xl bg-sky-500/10 p-4"><b>P1 — Conhecimentos Gerais</b><p class="muted text-sm mt-1">Peso 1 · ${P1.length} disciplinas</p></div><div class="rounded-xl bg-violet-500/10 p-4"><b>P2 — Conhecimentos Específicos</b><p class="muted text-sm mt-1">Peso 2 · ${P2.length} disciplinas</p></div></div></div>`}
function renderSubjects(data){return `<div class="space-y-4">${data.map((s,si)=>{let id=(data===P1?'p1':'p2')+si;let n=s[1].filter((_,i)=>state.done[id+'_'+i]).length;return `<section class="card border rounded-2xl overflow-hidden"><div class="p-4 bg-slate-500/10 flex justify-between gap-3"><div><h2 class="font-bold">${si+1}. ${s[0]}</h2><span class="muted text-xs">${n}/${s[1].length} tópicos estudados</span></div><span class="text-xs font-bold text-sky-500">${Math.round(n/s[1].length*100)}%</span></div><div class="p-3 space-y-2">${s[1].map((t,i)=>{let k=id+'_'+i,checked=!!state.done[k];return `<div class="topic border rounded-xl p-3 ${checked?'bg-emerald-500/10':''}"><label class="flex items-start gap-3 cursor-pointer"><input type="checkbox" class="mt-1 w-4 h-4" ${checked?'checked':''} onchange="mark('${k}',this.checked)"><span class="text-sm ${checked?'line-through opacity-70':''}">${t}</span></label><div class="ml-7 mt-2"><textarea rows="1" placeholder="Anotações (opcional)" onchange="note('${k}',this.value)">${state.notes[k]||''}</textarea></div></div>`}).join('')}</div></section>`}).join('')}</div>`}
function mark(k,v){state.done[k]=v;save();render()}function note(k,v){state.notes[k]=v;save()}function showTab(t){state.tab=t;save();render()}function render(){document.getElementById('app').className='app min-h-screen pb-12';document.getElementById('stats').innerHTML=stats();document.getElementById('content').innerHTML=state.tab==='overview'?overview():renderSubjects(state.tab==='p1'?P1:P2);updateCountdown()}function exportData(){let a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(state,null,2));a.download='backup-sefaz-sc.json';a.click()}function importData(e){let r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();render();alert('Backup importado com sucesso.')}catch(_){alert('Arquivo de backup inválido.')}};r.readAsText(e.target.files[0])}render();setInterval(updateCountdown,60000);
</script></body></html>
