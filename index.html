<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEFAZ/SC - Acompanhamento de Estudos (Cargo A01)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','sans-serif']}}}}</script>
<style>
:root{color-scheme:dark}.theme-dark{--bg-main:#0f172a;--bg-card:#1e293b;--bg-subcard:#334155;--text-main:#f8fafc;--text-muted:#94a3b8;--border-color:#475569;--input-bg:#0f172a}.theme-light{--bg-main:#f1f5f9;--bg-card:#fff;--bg-subcard:#f8fafc;--text-main:#0f172a;--text-muted:#64748b;--border-color:#e2e8f0;--input-bg:#fff}body{background:var(--bg-main);color:var(--text-main);transition:.3s}.theme-card{background:var(--bg-card);border-color:var(--border-color)}.theme-subcard{background:var(--bg-subcard);border-color:var(--border-color)}.theme-text-muted{color:var(--text-muted)}.theme-border{border-color:var(--border-color)}.theme-input{background:var(--input-bg);color:var(--text-main);border-color:var(--border-color)}button,input,textarea,select{transition:all .2s ease}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #10b981;outline-offset:2px}.progress-track{height:6px;background:rgba(148,163,184,.2);border-radius:99px;overflow:hidden}.progress-fill{height:100%;border-radius:99px;transition:width .3s ease}
</style>
</head>
<body class="theme-dark min-h-full font-sans pb-12">
<header class="theme-card border-b sticky top-0 z-50 backdrop-blur-md bg-opacity-90"><div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row md:items-center justify-between gap-4"><div class="flex items-center space-x-3"><div class="w-10 h-10 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-xl border border-emerald-500/30" aria-hidden="true">✓</div><div><h1 class="text-lg font-bold leading-tight">SEFAZ/SC • Edital nº 01/2026</h1><p class="text-xs theme-text-muted">Auditor Estadual de Finanças Públicas — Administração e Engenharias (Cargo A01)</p></div></div><div class="flex flex-wrap items-center gap-2"><div id="countdownBadge" class="px-3 py-1.5 rounded-xl bg-indigo-500/10 border border-indigo-500/30 text-indigo-400 text-xs font-semibold" aria-live="polite">⏳ Prova em 22/11/2026</div><button type="button" data-action="theme" class="px-3 py-1.5 rounded-xl text-xs font-semibold theme-subcard border">☀️ <span id="themeLabel">Modo Claro</span></button><button type="button" data-action="export" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-emerald-600 text-white">💾 Exportar</button><label class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-blue-600 text-white cursor-pointer">📂 Importar<input type="file" id="importFile" class="hidden" accept=".json"></label><button type="button" data-action="reset" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-rose-600 text-white">🗑️ Resetar</button></div></div></header>
<main class="max-w-7xl mx-auto px-4 mt-6 space-y-6"><div class="flex border-b theme-border space-x-2 overflow-x-auto"><button type="button" onclick="switchTab('overview')" id="tabBtnOverview" class="tab px-5 py-3 font-semibold text-sm whitespace-nowrap">📋 Panorama do Edital</button><button type="button" onclick="switchTab('p1')" id="tabBtnP1" class="tab px-5 py-3 font-semibold text-sm whitespace-nowrap">📘 Conhecimentos Gerais (P1)</button><button type="button" onclick="switchTab('p2')" id="tabBtnP2" class="tab px-5 py-3 font-semibold text-sm whitespace-nowrap">📙 Conhecimentos Específicos (P2 - Peso 2)</button></div><div id="tabContent" aria-live="polite"></div></main>
<script>
const EXAM_DATE=new Date('2026-11-22T00:00:00'),STORAGE_KEY='sefaz_sc_study_app_v2',LEGACY_KEY='sefaz_sc_study_app';
const EDITAL_DATA={p1:[{id:'p1_portugues',title:'Língua Portuguesa',topics:['Compreensão e interpretação de textos de gêneros variados','Reconhecimento de tipos e gêneros textuais','Domínio da estrutura morfossintática do período','Emprego dos tempos e modos verbais','Domínio dos mecanismos de coesão textual','Concordância verbal e nominal','Regência verbal e nominal','Emprego do sinal indicativo de crase','Pontuação e sintaxe da oração e do período']},{id:'p1_rlm_est',title:'Raciocínio Lógico-Matemático, Estatística e Matemática Financeira',topics:['Lógica proposicional e de argumentação','Operações com conjuntos e combinatória','Probabilidade básica e condicional','Estatística Descritiva: médias, mediana, moda e variância','Juros Simples e Compostos','Taxas nominais, efetivas e equivalentes','Sistemas de Amortização (PRICE e SAC)','Valor Presente Líquido (VPL) e Taxa Interna de Retorno (TIR)']},{id:'p1_direito_const',title:'Direito Constitucional',topics:['Princípios Fundamentais da CF/88','Direitos e Garantias Fundamentais','Organização Político-Administrativa do Estado','Administração Pública (Arts. 37 a 41)','Poder Executivo e Poder Legislativo','Sistema Tributário Nacional na CF/88','Finanças Públicas e Orçamento na CF/88']},{id:'p1_direito_admin',title:'Direito Administrativo',topics:['Estado, Governo e Administração Pública','Atos Administrativos: conceitos, atributos e anulação','Agentes Públicos e Regime Jurídico','Poderes da Administração Pública','Licitações e Contratos Administrativos (Lei nº 14.133/2021)','Serviços Públicos e Concessões','Improbidade Administrativa (Lei nº 8.429/1992)','Responsabilidade Civil do Estado']},{id:'p1_ciencia_dados',title:'Ciência de Dados e Tecnologia da Informação',topics:['Conceitos de Banco de Dados Relacionais e SQL','Modelagem dimensional e Data Warehouse','Conceitos de Business Intelligence e Dashboards','Noções de Linguagem Python para Análise de Dados','Governança de Dados e LGPD','Segurança da Informação e Criptografia']}],p2:[{id:'p2_ciclo_orcamentario',title:'Ciclo de Planejamento e Gestão Orçamentária',topics:['O processo de planejamento público no Brasil: PPA, LDO e LOA','Conceitos e funções econômicas no orçamento público','Princípios Orçamentários e suas exceções','Classificação institucional, funcional e programática','Classificação da Receita Pública por natureza e fontes','Estágios da Receita Pública: previsão, lançamento, arrecadação e recolhimento','Classificação da Despesa Pública (natureza e funcional)','Estágios da Despesa Pública: empenho, liquidação e pagamento','Restos a Pagar e Despesas de Exercícios Anteriores','Créditos Adicionais: suplementares, especiais e extraordinários']},{id:'p2_lrf',title:'Lei de Responsabilidade Fiscal (LC nº 101/2000)',topics:['Princípios, objetivos e abrangência da LRF','Planejamento: Anexos de Metas Fiscais e Riscos Fiscais na LDO','Receita Corrente Líquida (RCL): conceito e apuração','Geração da Despesa Pública e Despesa Obrigatória de Caráter Continuado','Despesa Total com Pessoal: limites globais e prudenciais','Dívida Pública, Operações de Crédito e Garantias','Transparência, Controle e Fiscalização da Gestão Fiscal']},{id:'p2_gestao_riscos_custos',title:'Gestão de Riscos, Custos e Avaliação de Políticas Públicas',topics:['Gestão de Riscos e Controles Internos no Setor Público','Modelos COSO-ERM e ABNT NBR ISO 31000','Sistema de Custos no Setor Público','Indicadores de Desempenho: Eficiência, Eficácia e Efetividade','Avaliação Ex-ante e Ex-post de Políticas Públicas']},{id:'p2_admin_geral',title:'Administração Geral e Estratégica',topics:['Evolução do pensamento administrativo','Processo Organizacional: Planejamento, Organização, Direção e Controle','Planejamento Estratégico: Matriz SWOT, BSC e OKRs','Gestão de Processos (BPM) e Melhoria Contínua','Gestão de Projetos: PMBOK e Metodologias Ágeis']}]};
const defaults=()=>({theme:'dark',activeTab:'overview',filter:'all',progress:{},openSubjects:{},openTopics:{}});let appState=defaults();
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function topicData(k){let d=appState.progress[k];if(!d)d={theory:false,theoryDate:'',revisions:[],exerciseSessions:[],link:'',notes:''};d.revisions=Array.isArray(d.revisions)?d.revisions:[];d.exerciseSessions=Array.isArray(d.exerciseSessions)?d.exerciseSessions:[];appState.progress[k]=d;return d}
function normalize(s){const d=defaults();if(!s||typeof s!=='object')return d;d.theme=s.theme==='light'?'light':'dark';d.activeTab=['overview','p1','p2'].includes(s.activeTab)?s.activeTab:'overview';d.filter=typeof s.filter==='string'?s.filter:'all';d.progress=s.progress&&typeof s.progress==='object'?s.progress:{};d.openSubjects=s.openSubjects||{};d.openTopics=s.openTopics||{};Object.keys(d.progress).forEach(k=>{const x=topicData.call({progress:d.progress},k);d.progress[k]=x});return d}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(appState));updateStats()}
function load(){try{const raw=localStorage.getItem(STORAGE_KEY)||localStorage.getItem(LEGACY_KEY);if(raw)appState=normalize(JSON.parse(raw))}catch(e){console.error(e);appState=defaults()}applyTheme();updateCountdown();renderAll()}
function applyTheme(){document.body.className=`theme-${appState.theme} min-h-full font-sans pb-12`;document.getElementById('themeLabel').innerText=appState.theme==='dark'?'Modo Claro':'Modo Escuro'}
function updateCountdown(){const diff=Math.ceil((EXAM_DATE-new Date())/86400000);document.getElementById('countdownBadge').innerText=diff>0?`⏳ Prova em ${diff} dias (22/11/2026)`:diff===0?'🎯 Prova Hoje!':'✅ Prova já realizada'}
function switchTab(tab){if(!['overview','p1','p2'].includes(tab))return;appState.activeTab=tab;['overview','p1','p2'].forEach(x=>{const b=document.getElementById('tabBtn'+(x==='overview'?'Overview':x.toUpperCase()));if(b)b.className=`tab px-5 py-3 font-semibold text-sm whitespace-nowrap ${tab===x?'border-b-2 border-emerald-400 text-emerald-400':'theme-text-muted'}`});renderTabContent()}
function renderAll(){switchTab(appState.activeTab);updateStats()}
function metric(label,pct,count,total,color,sub=''){return `<div class="theme-card p-4 rounded-2xl border"><span class="text-[11px] font-bold uppercase tracking-wider theme-text-muted">${label}</span><div class="flex items-end justify-between mt-1"><strong class="text-2xl font-extrabold ${color}">${pct}%</strong><span class="text-xs theme-text-muted">${count} / ${total}</span></div><div class="progress-track mt-2"><div class="progress-fill ${color.replace('text-','bg-')}" style="width:${pct}%"></div></div><div class="text-xs theme-text-muted mt-1">${sub}</div></div>`}
function getStats(){let total=0,theory=0,rev=0,trained=0,qty=0,acc=0;['p1','p2'].forEach(t=>(EDITAL_DATA[t]||[]).forEach(s=>s.topics.forEach((_,i)=>{total++;const d=appState.progress[`${s.id}_${i}`];if(!d)return;if(d.theory)theory++;if(d.revisions)rev+=d.revisions.length;if(d.exerciseSessions?.length)trained++;(d.exerciseSessions||[]).forEach(x=>{qty+=+x.qty||0;acc+=+x.acc||0})})));return{total,theory,rev,trained,qty,acc}}
function statsCards(){const s=getStats(),pct=v=>s.total?Math.round(v/s.total*100):0;return `<div class="grid grid-cols-2 md:grid-cols-5 gap-3">${metric('Progresso Edital',pct(s.theory),s.theory,s.total,'text-emerald-400','tópicos concluídos')}${metric('Teorias Vistas',pct(s.theory),s.theory,s.total,'text-blue-400','tópicos estudados')}${metric('Revisões Feitas',Math.min(100,Math.round(s.rev/(s.total*3)*100)),s.rev,s.total*3,'text-purple-400','meta de 3 revisões por tópico')}${metric('Tópicos c/ Treino',pct(s.trained),s.trained,s.total,'text-amber-400','tópicos com exercícios')}${metric('Taxa de Acertos',s.qty?Math.round(s.acc/s.qty*100):0,s.qty,s.acc,'text-rose-400',`${s.acc} acertos`)} </div>`}
function renderTabContent(){const c=document.getElementById('tabContent');c.innerHTML=statsCards()+(appState.activeTab==='overview'?overview():subjects())}
function row(k,label,value,highlight=''){return `<div class="flex justify-between gap-4 py-1.5 border-b theme-border text-xs"><span class="theme-text-muted">${label}</span><span class="font-semibold text-right ${highlight}">${value}</span></div>`}
function overview(){return `<div class="space-y-6 mt-6"><div class="grid grid-cols-1 lg:grid-cols-3 gap-6"><div class="theme-card p-5 rounded-2xl border"><h3 class="font-bold text-base mb-3">💼 Cargo e Vagas</h3>${row(1,'Cargo','Auditor Est. Finanças Públicas')}${row(1,'Área','Administração e Engenharias (A01)')}${row(1,'Remuneração Inicial','R$ 25.337,61','text-emerald-400')}${row(1,'Carga Horária','40 horas semanais')}${row(1,'Vagas Ampla','5 vagas')}${row(1,'Vagas PcD','1 vaga (Total: 6)')}</div><div class="theme-card p-5 rounded-2xl border"><h3 class="font-bold text-base mb-3">📅 Inscrições e Datas</h3>${row(1,'Inscrições','04/09 a 05/10/2026')}${row(1,'Taxa','R$ 200,00 (DARE)')}${row(1,'Pagamento DARE','Até 06/10/2026')}${row(1,'Isenção','04/09 a 08/09/2026')}${row(1,'Data das Provas','22/11/2026','text-emerald-400')}${row(1,'Banca','FCC')}</div><div class="theme-card p-5 rounded-2xl border"><h3 class="font-bold text-base mb-3">⏱️ Aplicação das Provas</h3>${row(1,'Local','Florianópolis/SC')}${row(1,'Manhã (P1)','Conhecimentos Gerais (4h)')}${row(1,'Tarde (P2)','Conhecimentos Específicos (5h)')}${row(1,'Permanência Mínima','3 horas de prova')}${row(1,'Formato','Objetiva (A a E)')}</div></div><div class="theme-card rounded-2xl border overflow-hidden"><div class="p-5"><h3 class="font-bold text-base">📊 Estrutura das Provas Objetivas e Pesos</h3></div><div class="overflow-x-auto"><table class="w-full text-xs text-left"><thead class="theme-subcard"><tr><th class="p-3">PROVA</th><th class="p-3">DISCIPLINAS</th><th class="p-3">QUESTÕES</th><th class="p-3">PESO</th><th class="p-3">DURAÇÃO</th><th class="p-3">TURNO</th></tr></thead><tbody class="divide-y theme-border"><tr><td class="p-3 font-bold text-amber-400">PROVA 1</td><td class="p-3">Conhecimentos Gerais (Português, RLM/Est/MatFin, D. Const, D. Admin, Ciên. Dados, Ética, Hist/Geog SC)</td><td class="p-3 font-bold">80</td><td class="p-3">1</td><td class="p-3">4 horas</td><td class="p-3"><span class="px-2 py-1 rounded bg-amber-500/20 text-amber-400">Manhã</span></td></tr><tr><td class="p-3 font-bold text-cyan-400">PROVA 2</td><td class="p-3">Conhecimentos Específicos (Ciclo Orçamentário, LRF, Gestão de Riscos, Custos, Admin Geral e Estratégica)</td><td class="p-3 font-bold">100</td><td class="p-3">2</td><td class="p-3">5 horas</td><td class="p-3"><span class="px-2 py-1 rounded bg-cyan-500/20 text-cyan-400">Tarde</span></td></tr></tbody></table></div></div><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div class="theme-card p-5 rounded-2xl border"><h3 class="font-bold text-base mb-3">📈 Fórmula da Nota Padronizada (FCC)</h3><div class="theme-subcard rounded-xl p-4 text-center font-mono text-sm mb-3">NP = 50 + 10 × (X − X̄) / s</div><p class="text-xs theme-text-muted"><strong>X</strong> é a nota do candidato; <strong>X̄</strong> é a média das notas; e <strong>s</strong> é o desvio-padrão das notas.</p></div><div class="theme-card p-5 rounded-2xl border"><h3 class="font-bold text-base mb-3">✅ Critério Mínimo de Aprovação</h3><ul class="text-xs theme-text-muted list-disc pl-5 space-y-2"><li>Obter no mínimo 50% de aproveitamento em cada prova.</li><li>Não zerar nenhuma disciplina.</li><li>Observar os demais critérios e classificações previstos no edital.</li></ul></div></div></div>`}
function subjects(){const list=EDITAL_DATA[appState.activeTab]||[];return `<div class="mt-6 space-y-4"><div class="theme-card p-4 rounded-2xl border flex flex-col md:flex-row md:items-center gap-3"><label for="disciplineFilter" class="text-sm font-semibold">Filtrar por disciplina:</label><select id="disciplineFilter" onchange="setFilter(this.value)" class="theme-input border rounded-xl px-3 py-2 text-sm flex-1 md:max-w-md"><option value="all">Todas as disciplinas</option>${list.map(s=>`<option value="${s.id}" ${appState.filter===s.id?'selected':''}>${s.title}</option>`).join('')}</select><span class="text-xs theme-text-muted">${list.length} disciplinas</span></div><div id="subjectList" class="space-y-4">${list.filter(s=>appState.filter==='all'||s.id===appState.filter).map(subject).join('')}</div></div>`}
function subject(s){const open=appState.openSubjects[s.id]!==false;return `<section class="theme-card rounded-2xl border overflow-hidden shadow-sm"><div class="p-4 theme-subcard border-b flex justify-between items-center cursor-pointer" onclick="toggleSubject('${s.id}')" role="button" tabindex="0"><div class="flex items-center gap-3"><h2 class="font-bold text-base">${s.title}</h2><span class="text-xs px-2.5 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">${s.topics.length} tópicos</span></div><span id="arrow_${s.id}" class="${open?'rotate-180':''}">▼</span></div><div id="body_${s.id}" class="divide-y theme-border ${open?'':'hidden'}">${s.topics.map((t,i)=>topic(s.id,i,t)).join('')}</div></section>`}
function topic(sid,i,text){const k=`${sid}_${i}`,d=topicData(k),open=!!appState.openTopics[k],total=(d.exerciseSessions||[]).reduce((n,x)=>n+(+x.qty||0),0),acc=(d.exerciseSessions||[]).reduce((n,x)=>n+(+x.acc||0),0),pct=total?Math.round(acc/total*100):0;return `<div class="p-4 space-y-3" id="topic_row_${k}"><div class="flex flex-col lg:flex-row lg:items-center justify-between gap-3"><div class="flex-1"><span class="text-xs font-bold theme-text-muted mr-2">#${i+1}</span><span class="text-sm font-medium">${text}</span></div><div class="flex flex-wrap gap-2 items-center"><span class="px-3 py-1.5 rounded-xl border text-xs ${d.theory?'text-emerald-400 bg-emerald-500/20':'theme-subcard'}">${d.theory?'✓ Teoria':'Teoria Pendente'} ${d.theoryDate?`(${d.theoryDate})`:''}</span>${d.link?`<a href="${d.link}" target="_blank" rel="noopener noreferrer" class="px-3 py-1.5 rounded-xl text-xs text-blue-400 border border-blue-500/30">🔗 Abrir Caderno TEC</a>`:''}<span class="px-2.5 py-1.5 theme-subcard border rounded-xl text-xs font-bold ${pct>=80?'text-emerald-400':pct>=60?'text-amber-400':'text-rose-400'}">${total?`${pct}% (${acc}/${total})`:'Sem exercícios'}</span><button type="button" onclick="toggleTopic('${k}')" class="px-3 py-1.5 theme-subcard border rounded-xl text-xs font-semibold">⚙️ Detalhes & Histórico</button></div></div><div id="details_${k}" class="${open?'':'hidden'} pt-3 border-t theme-border space-y-4"><div class="grid grid-cols-1 md:grid-cols-2 gap-4"><div class="space-y-3"><div class="theme-subcard p-3 rounded-xl border space-y-2"><h4 class="text-xs font-bold text-emerald-400">📖 Data de Estudo da Teoria</h4><div class="flex gap-2"><input type="date" id="theoryDate_input_${k}" max="${today()}" value="${d.theoryDate||today()}" class="flex-1 theme-input border rounded p-1.5 text-xs"><button type="button" onclick="saveTheory('${k}')" class="px-3 py-1.5 bg-emerald-600 text-white rounded-lg text-xs">Salvar Teoria</button></div></div><div class="theme-subcard p-3 rounded-xl border space-y-2"><h4 class="text-xs font-bold text-amber-400">➕ Registrar Nova Sessão de Exercícios</h4><div class="grid grid-cols-3 gap-2"><input type="number" id="qty_${k}" placeholder="Qtd" class="theme-input border rounded p-1 text-xs"><input type="number" id="acc_${k}" placeholder="Acertos" class="theme-input border rounded p-1 text-xs"><input type="date" id="date_${k}" max="${today()}" value="${today()}" class="theme-input border rounded p-1 text-xs"></div><button type="button" onclick="addExercise('${k}')" class="w-full py-1.5 bg-amber-600 text-white rounded-lg text-xs">Salvar Sessão de Exercícios</button></div><div class="theme-subcard p-3 rounded-xl border space-y-2"><h4 class="text-xs font-bold text-purple-400">📅 Registrar Data de Revisão</h4><div class="flex gap-2"><input type="date" id="rev_${k}" max="${today()}" value="${today()}" class="flex-1 theme-input border rounded p-1.5 text-xs"><button type="button" onclick="addRevision('${k}')" class="px-3 py-1.5 bg-purple-600 text-white rounded-lg text-xs">Adicionar Revisão</button></div></div><div class="theme-subcard p-3 rounded-xl border space-y-2"><h4 class="text-xs font-bold text-blue-400">🔗 Link do Caderno TEC / Questões</h4><div class="flex gap-2"><input type="url" id="link_${k}" value="${d.link||''}" placeholder="https://..." class="flex-1 theme-input border rounded p-1.5 text-xs"><button type="button" onclick="saveLink('${k}')" class="px-3 py-1.5 bg-blue-600 text-white rounded-lg text-xs">Salvar Link</button></div></div></div><div><label class="text-xs font-bold theme-text-muted block mb-2">📝 Resumo Rápido & Anotações</label><textarea oninput="updateNotes('${k}',this.value)" class="w-full h-56 theme-input border rounded-xl p-3 text-sm" placeholder="Digite resumos, pegadinhas ou leis importantes...">${d.notes||''}</textarea><span class="text-[10px] theme-text-muted block text-right">Salvo automaticamente no navegador</span></div></div><div class="grid md:grid-cols-2 gap-4"><div class="theme-subcard p-3 rounded-xl border"><h5 class="text-xs font-bold text-amber-400 mb-2">Histórico de Treinos</h5>${(d.exerciseSessions||[]).map((x,j)=>`<div class="flex justify-between text-xs py-1"><span>${x.date}</span><span>${x.acc}/${x.qty}</span><button type="button" onclick="removeExercise('${k}',${j})" class="text-rose-400">Excluir</button></div>`).join('')||'<i class="text-xs theme-text-muted">Nenhum treino registrado.</i>'}</div><div class="theme-subcard p-3 rounded-xl border"><h5 class="text-xs font-bold text-purple-400 mb-2">Histórico de Revisões</h5>${(d.revisions||[]).map((x,j)=>`<div class="flex justify-between text-xs py-1"><span>Revisão #${j+1}</span><span>${x}</span><button type="button" onclick="removeRevision('${k}',${j})" class="text-rose-400">Excluir</button></div>`).join('')||'<i class="text-xs theme-text-muted">Nenhuma revisão registrada.</i>'}</div></div></div></div>`}
function setFilter(v){appState.filter=v;save();renderTabContent()}
function toggleSubject(id){appState.openSubjects[id]=appState.openSubjects[id]===false;save();renderTabContent()}
function toggleTopic(k){appState.openTopics[k]=!appState.openTopics[k];save();renderTabContent()}
function keepOpen(k){appState.openTopics[k]=true}
function saveTheory(k){const v=document.getElementById(`theoryDate_input_${k}`).value;if(v>today())return alert('Não é permitido registrar datas futuras.');const d=topicData(k);d.theory=true;d.theoryDate=v;keepOpen(k);save();renderTabContent()}
function addExercise(k){const q=+document.getElementById(`qty_${k}`).value,a=+document.getElementById(`acc_${k}`).value,date=document.getElementById(`date_${k}`).value;if(date>today())return alert('Não é permitido registrar datas futuras.');if(!q||a<0||a>q)return alert('Informe quantidade e acertos válidos.');topicData(k).exerciseSessions.unshift({qty:q,acc:a,date});keepOpen(k);save();renderTabContent()}
function addRevision(k){const v=document.getElementById(`rev_${k}`).value;if(v>today())return alert('Não é permitido registrar datas futuras.');if(!v)return;topicData(k).revisions.unshift(v);keepOpen(k);save();renderTabContent()}
function saveLink(k){const d=topicData(k);d.link=document.getElementById(`link_${k}`).value.trim();keepOpen(k);save();renderTabContent()}
function updateNotes(k,v){topicData(k).notes=v;save()}
function removeExercise(k,i){topicData(k).exerciseSessions.splice(i,1);keepOpen(k);save();renderTabContent()}
function removeRevision(k,i){topicData(k).revisions.splice(i,1);keepOpen(k);save();renderTabContent()}
function updateStats(){/* Os cards são renderizados junto com a aba para permanecerem sempre atualizados. */}
function exportBackup(){const a=document.createElement('a');a.href='data:text/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(appState,null,2));a.download=`SEFAZ_SC_Estudos_Backup_${today()}.json`;a.click()}
function importBackup(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{appState=normalize(JSON.parse(r.result));save();applyTheme();renderAll();alert('Backup importado com sucesso!')}catch(x){alert('Arquivo de backup inválido.')}e.target.value=''};r.readAsText(f)}
function resetData(){if(!confirm('Deseja apagar todo o progresso salvo no navegador?'))return;localStorage.removeItem(STORAGE_KEY);localStorage.removeItem(LEGACY_KEY);appState=defaults();applyTheme();renderAll();alert('Dados resetados com sucesso.')}
document.addEventListener('click',e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(a==='theme'){appState.theme=appState.theme==='dark'?'light':'dark';applyTheme();save()}if(a==='export')exportBackup();if(a==='reset')resetData()});document.getElementById('importFile').addEventListener('change',importBackup);window.addEventListener('DOMContentLoaded',load);</script>
</body></html>
